<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#17140f" />
<title>GenPrep · No internet</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17140f;text-align:center;padding:24px}
  img{width:96px;height:96px}
  h1{font-size:22px;margin:20px 0 6px}
  p{color:#6b6253;margin:0 0 22px;line-height:1.5}
  button{background:#17140f;color:#e5c372;border:0;border-radius:14px;padding:14px 26px;font-weight:700;font-size:15px}
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>GenPrep needs the internet.<br />Your saved test answers are safe. Connect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
