# Nightly Supabase → GenPrep sync (brings in new questions from the Question Bank Portal).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  the same value as CRON_SECRET on the server
#   SITE_URL     https://www.genprep.online
name: Nightly question sync
on:
  schedule:
    - cron: "43 20 * * *" # 2:13 am India time
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server to sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/sync/cron"
